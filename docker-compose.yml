services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobstrainer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/jobstrainer
      OPENSEARCH_URL: http://opensearch:9200
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_LARGE: ${GROQ_MODEL_LARGE}
      GROQ_MODEL_BASE: ${GROQ_MODEL_BASE}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    restart: unless-stopped
    environment:
      OFFER_QUERY: ${OFFER_QUERY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_LARGE: ${GROQ_MODEL_LARGE}
      GROQ_MODEL_BASE: ${GROQ_MODEL_BASE}
      SERPERDEV_API_KEY: ${SERPERDEV_API_KEY}
      DDGS_PROXY: ${DDGS_PROXY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      BACKEND_URL: http://backend:8000
    volumes:
      - ./data:/app/ingestion/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
