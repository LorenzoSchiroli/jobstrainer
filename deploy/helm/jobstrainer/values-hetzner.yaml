imagePullPolicy: Always
storageClass: hcloud-volumes

nodePools:
  permanent:
    labelKey: jobstrainer.io/node-pool
    labelValue: permanent
  burst:
    labelKey: jobstrainer.io/node-pool
    labelValue: burst

scheduling:
  postgres: permanent
  opensearch: permanent
  worker: permanent
  ingestion: burst

postgres:
  storage: 10Gi
  pgdataSubdir: pgdata

opensearch:
  storage: 20Gi
  javaOpts: "-Xms512m -Xmx512m"
  fsGroup: 1000

bootstrap:
  image:
    repository: ghcr.io/jobstrainer-demo/jobstrainer-backend
    tag: latest

api:
  image:
    repository: ghcr.io/jobstrainer-demo/jobstrainer-backend
    tag: latest

worker:
  image:
    repository: ghcr.io/jobstrainer-demo/jobstrainer-backend
    tag: latest

ingestion:
  image:
    repository: ghcr.io/jobstrainer-demo/jobstrainer-ingestion
    tag: latest
  # Daily rather than every two hours: burst affinity boots a CX33 per run.
  schedule: "0 3 * * *"
  # Cover a full day plus overlap (matches prior pipeline --hours default).
  hours: 48
  # Larger lookback can run longer than the local 30m deadline.
  activeDeadlineSeconds: 3600

frontend:
  image:
    repository: ghcr.io/jobstrainer-demo/jobstrainer-frontend
    tag: latest

ingress:
  enabled: true
  className: traefik
  frontendHost: app.example.com
  apiHost: api.example.com
  frontendTlsSecretName: jobstrainer-frontend-tls
  apiTlsSecretName: jobstrainer-api-tls

certManager:
  createIssuers: true
  email: ops@example.com
  issuerName: letsencrypt-staging
