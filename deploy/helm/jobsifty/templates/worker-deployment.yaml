apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      {{- $nodeContext := dict "root" . "pool" .Values.scheduling.worker }}
      {{- with include "jobsifty.nodeAffinity" $nodeContext }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
      - name: worker
        image: {{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["uv", "run", "python", "-m", "backend.worker"]
        env:
        - name: BACKUP_INTERVAL_SECONDS
          value: {{ .Values.backup.intervalSeconds | quote }}
        envFrom:
        - secretRef:
            name: {{ .Values.existingSecret }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
