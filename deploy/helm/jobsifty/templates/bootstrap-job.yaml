apiVersion: batch/v1
kind: Job
metadata:
  name: jobsifty-bootstrap
  annotations:
    # post-install (not pre-): on a fresh install the chart itself deploys
    # postgres/opensearch, and a pre-install hook would run before they exist.
    # post-install lets the Job retry while the stores boot; pre-upgrade keeps
    # migrations running BEFORE new app code rolls out on upgrades.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # generous: first attempts may crash while postgres/opensearch are starting
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: {{ .Values.bootstrap.image.repository }}:{{ .Values.bootstrap.image.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m backend.bootstrap"]
        envFrom:
        - secretRef:
            name: {{ .Values.existingSecret }}
        resources:
          {{- toYaml .Values.bootstrap.resources | nindent 10 }}
