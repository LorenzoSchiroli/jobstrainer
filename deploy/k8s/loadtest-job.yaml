apiVersion: v1
kind: ConfigMap
metadata:
  name: api-loadtest-script
data:
  load.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      stages: [
        { duration: '60s', target: 20 },
        { duration: '60s', target: 50 },
        { duration: '30s', target: 0 },
      ],
    };

    // /jobs/search is JWT-protected: register a throwaway user once and
    // share its token with every VU. Unique name per run avoids collisions.
    export function setup() {
      const res = http.post(
        'http://api:8000/auth/register',
        JSON.stringify({
          username: `loadtest-${Date.now()}`,
          password: 'loadtest-password',
        }),
        { headers: { 'Content-Type': 'application/json' } },
      );
      return { token: res.json('access_token') };
    }

    const payload = JSON.stringify({
      cv_text: 'Experienced machine learning engineer with Python, PyTorch, and NLP background. Built search and recommendation systems and hybrid retrieval pipelines.',
      query: 'machine learning engineer remote',
    });

    export default function (data) {
      http.post('http://api:8000/jobs/search', payload, {
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${data.token}`,
        },
      });
      sleep(1);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-loadtest
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:latest
        args: ["run", "/scripts/load.js"]
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: api-loadtest-script
