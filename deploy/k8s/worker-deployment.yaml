apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: jobstrainer-backend:local
        imagePullPolicy: IfNotPresent
        command: ["uv", "run", "python", "-m", "backend.worker"]
        envFrom:
        - secretRef:
            name: jobstrainer-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
