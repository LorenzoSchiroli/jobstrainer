apiVersion: batch/v1
kind: Job
metadata:
  name: jobstrainer-bootstrap
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: jobstrainer-backend:local
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m backend.bootstrap"]
        envFrom:
        - secretRef:
            name: jobstrainer-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
