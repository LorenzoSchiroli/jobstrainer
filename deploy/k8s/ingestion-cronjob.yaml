apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  # Flip to true (or `kubectl patch cronjob ingestion -p '{"spec":{"suspend":true}}'`)
  # to pause scheduled runs without deleting the CronJob.
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      # Hard ceiling so a slow run (dead API keys → slow fallback scraping)
      # self-terminates instead of holding the Forbid lock forever and wedging
      # every subsequent scheduled run. Healthy runs finish in 3-7 min.
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: ingestion
            image: jobstrainer-ingestion:local
            imagePullPolicy: IfNotPresent
            command: ["uv", "run", "python", "-m", "ingestion.pipeline", "$(OFFER_QUERY)", "--hours", "2"]
            envFrom:
            - secretRef:
                name: jobstrainer-secrets
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 1500m
                memory: 2Gi
